services:
  # ===================================================
  # GDGoC PSIT Backend REST API
  # ===================================================
  - type: web
    name: gdgoc-api
    runtime: node
    rootDir: server
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # ===================================================
  # GDGoC PSIT Frontend React Platform
  # ===================================================
  - type: web
    name: gdgoc-frontend
    runtime: static
    rootDir: .
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
